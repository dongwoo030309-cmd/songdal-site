<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="송달">
<meta name="theme-color" content="#1b5e4a">
<title>송달 방문표</title>
<link rel="stylesheet" href="style.css">
<script src="config.js" onerror="window.SONGDAL_CONFIG={}"></script>
</head>
<body>
<div id="gate" class="gate hidden">
  <h1>송달 방문표</h1>
  <p id="gate-msg">맥에서 보낸 <b>연결 링크</b>로 열어 주세요. 처음 한 번만 열면 이 아이폰에 열쇠가 저장돼요.</p>
  <input id="gate-token" placeholder="또는 연결 링크를 여기에 붙여넣기" autocomplete="off">
  <button id="gate-save">열기</button>
  <p class="hint">연결 링크는 맥 프로그램 → 설정 → 5번 → '아이폰 연결 링크 복사'에 있어요.</p>
</div>

<div id="app" class="app hidden">
  <header class="bar">
    <div>
      <div class="title" id="bar-title">방문표</div>
      <div class="sub" id="bar-sub"></div>
    </div>
    <div class="bar-btns">
      <button class="icon" id="btn-list" title="목록">목록</button>
      <button class="icon" id="btn-more" title="더보기" aria-label="더보기">⋯</button>
    </div>
    <div id="menu" class="menu hidden">
      <button id="btn-play">▶ 순서대로 경로보기</button>
      <button id="btn-fit">전체 경로 보기</button>
      <button id="btn-maptype">위성 지도</button>
      <button id="btn-send">오늘 결과 맥으로 보내기</button>
      <button id="btn-reload">↻ 새로 받기</button>
      <button id="btn-reset" class="danger">오늘 기록 모두 지우기…</button>
      <div id="menu-info" class="menu-info"></div>
    </div>
  </header>
  <div class="map-wrap"><div id="map" class="map"></div>
    <div class="map-btns"><button id="map-next">다음 곳</button><button id="map-me">내 위치</button></div>
    <div id="note" class="note hidden"></div></div>
  <div id="recalc" class="recalc hidden"></div>
  <div id="send" class="recalc hidden"></div>

  <section id="sheet" class="sheet">
    <button class="handle" id="handle" aria-label="카드 접기/펼치기"><span></span></button>
    <div id="sync-status" class="sync"></div>
    <div id="next" class="next"></div>
    <div id="list" class="list hidden"></div>
  </section>
</div>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
